yamlname: Cloud Android Build Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out project source code
      uses: actions/checkout@v4

    - name: Set up Java Development Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK tools automatically
      uses: android-actions/setup-android@v3

    - name: Grant execution privileges to runner
      run: chmod +x gradlew

    - name: Compile Application package file safely
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload installable application package file
      uses: actions/upload-artifact@v4
      with:
        name: PokeScanner-App-Installer
        path: app/build/outputs/apk/debug/app-debug.apk
